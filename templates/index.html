<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chem Clinic Scheduler</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  button { background: #2e7d32; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
  button:disabled { background: #999; cursor: default; }
  table { border-collapse: collapse; width: 100%; margin-top: 24px; font-size: 14px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  th { background: #f0f0f0; }
  .warning { color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 10px; border-radius: 6px; margin-top: 16px; font-size: 14px; }
  .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 10px; border-radius: 6px; margin-top: 16px; }
  #status { margin-top: 12px; font-size: 14px; color: #555; }
</style>
</head>
<body>

<h1>Chem Clinic Scheduler</h1>
<p>Click below to pull current availability responses and generate this week's schedule.</p>
<button id="genBtn" onclick="generateSchedule()">Generate Schedule</button>
<div id="status"></div>
<div id="results"></div>

<script>
async function generateSchedule(force) {
  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  const results = document.getElementById('results');

  btn.disabled = true;
  status.textContent = 'Checking responses...';
  results.innerHTML = '';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ force: !!force })
    });
    const data = await res.json();

    if (!res.ok) {
      status.innerHTML = `<div class="error">${data.error}</div>`;
      btn.disabled = false;
      return;
    }

    if (data.not_ready) {
      status.innerHTML = `
        <div class="warning">
          Only ${data.tutor_count} of ${data.min_required} tutors have responded so far
          (${data.tutor_names.join(', ') || 'none yet'}).
          Schedule won't auto-generate until enough responses are in.
        </div>`;
      const forceBtn = document.createElement('button');
      forceBtn.textContent = 'Generate anyway';
      forceBtn.style.marginTop = '10px';
      forceBtn.onclick = () => generateSchedule(true);
      results.appendChild(forceBtn);
      btn.disabled = false;
      return;
    }

    status.textContent = `Loaded ${data.tutor_count} tutors: ${data.tutor_names.join(', ')}`;

    let html = '<table><tr><th>Time</th>';
    for (const day of data.days) html += `<th>${day}</th>`;
    html += '</tr>';

    for (const row of data.grid) {
      html += `<tr><td>${row.time}</td>`;
      for (const day of data.days) html += `<td>${row[day] || ''}</td>`;
      html += '</tr>';
    }
    html += '</table>';

    if (data.uncovered && data.uncovered.length > 0) {
      html += `<div class="warning"><strong>Uncovered slots (not enough available tutors):</strong><br>${data.uncovered.join('<br>')}</div>`;
    }

    results.innerHTML = html;
  } catch (err) {
    status.innerHTML = `<div class="error">Something went wrong: ${err}</div>`;
  }

  btn.disabled = false;
}
</script>

</body>
</html>
